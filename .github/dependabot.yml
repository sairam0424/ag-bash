# Dependabot keeps the SHA-pinned GitHub Actions and the npm dependency tree
# current. Updates land as weekly, grouped PRs (one per ecosystem/scope) to keep
# review load low. github-actions bumps of ANY update type (including majors)
# ARE auto-merged by .github/workflows/dependabot-auto-merge.yml, on the theory
# that a SHA pin makes the *supply chain* trustworthy - that does NOT guarantee
# *functional* compatibility with how this repo actually invokes the action.
# Confirmed the hard way: #141 auto-merged changesets/action 1.8.0 -> 2.1.2
# (grouped with 12 unrelated, actually-safe bumps) and broke every release
# attempt until pinned back via the `ignore:` rule below. setup-vendor.js (the
# npm postinstall) is fully offline/deterministic, so npm update PRs build
# cleanly in CI.
#
# The changesets/action ignore rule below was narrowed (not removed) when
# this repo deliberately bumped to action v2.1.2 + @changesets/cli v3.0.3
# together: the action's own error message ties its major version directly
# to the Changesets CLI major it expects, so any FUTURE auto-merged
# github-actions bump to changesets/action v3+ would silently repeat the
# #141 incident unless the CLI is bumped in lockstep by a human in the same
# PR. Auto-merge here has no way to know about that CLI coupling.
version: 2
updates:
  # --- GitHub Actions used by all workflows + the composite action ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    ignore:
      # This repo now runs changesets/action v2.1.2 paired with
      # @changesets/cli ^3.0.3 (bumped together, deliberately, in the same
      # PR that narrowed this rule). v2.1.2's own error message says it
      # plainly: "This version of the Changesets action is designed to work
      # with Changesets CLI v3. Changesets CLI v2 is not supported" - the
      # action's major version is HARD-COUPLED to the CLI's major version.
      # #141 already proved auto-merge cannot see that coupling: it bumped
      # this action alone (grouped with 12 unrelated, actually-safe bumps)
      # while the CLI stayed on v2, breaking every release until #160
      # reverted it. Ignoring only ">=3.0.0" (not ">=2.0.0") lets routine
      # v2.x patch/minor bumps through auto-merge as before, while still
      # blocking the next major (which would again require a paired,
      # human-reviewed @changesets/cli bump) from auto-merging alone.
      - dependency-name: "changesets/action"
        versions: [">=3.0.0"]

  # --- npm: root workspace tooling (biome, typescript, vitest, esbuild) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      root-dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  # --- npm: per-package dependencies (workspace-aware) ---
  - package-ecosystem: "npm"
    directory: "/packages/bash"
    schedule:
      interval: "weekly"
    groups:
      bash-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(bash)"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-server"
    schedule:
      interval: "weekly"
    groups:
      mcp-server-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(mcp)"

  - package-ecosystem: "npm"
    directory: "/packages/agent-bridge"
    schedule:
      interval: "weekly"
    groups:
      agent-bridge-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(agent-bridge)"

  # --- Docker: base-image bumps for the Docker MCP Catalog image ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  # --- git submodule: mcp-registry is a fork pinned to a specific branch
  # (add-ag-bash-mindforge), not upstream's default branch. Dependabot can
  # only propose bumping the pinned commit on that same branch/fork — it
  # will NOT switch branches or repos — so this just gives visibility into
  # upstream commits landing on our pinned branch instead of silent staleness.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(submodule)"
