# Dependabot keeps the SHA-pinned GitHub Actions and the npm dependency tree
# current. Updates land as weekly, grouped PRs (one per ecosystem/scope) to keep
# review load low. Action-version bumps are NEVER auto-merged — a SHA pin is a
# trust decision and must be reviewed. setup-vendor.js (the npm postinstall) is
# fully offline/deterministic, so npm update PRs build cleanly in CI.
version: 2
updates:
  # --- GitHub Actions used by all workflows + the composite action ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # --- npm: root workspace tooling (biome, typescript, vitest, esbuild) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      root-dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  # --- npm: per-package dependencies (workspace-aware) ---
  - package-ecosystem: "npm"
    directory: "/packages/bash"
    schedule:
      interval: "weekly"
    groups:
      bash-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(bash)"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-server"
    schedule:
      interval: "weekly"
    groups:
      mcp-server-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(mcp)"

  - package-ecosystem: "npm"
    directory: "/packages/agent-bridge"
    schedule:
      interval: "weekly"
    groups:
      agent-bridge-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(agent-bridge)"

  # --- Docker: base-image bumps for the Docker MCP Catalog image ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  # --- git submodule: mcp-registry is a fork pinned to a specific branch
  # (add-ag-bash-mindforge), not upstream's default branch. Dependabot can
  # only propose bumping the pinned commit on that same branch/fork — it
  # will NOT switch branches or repos — so this just gives visibility into
  # upstream commits landing on our pinned branch instead of silent staleness.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(submodule)"
