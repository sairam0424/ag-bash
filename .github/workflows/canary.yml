name: Nightly Canary
on:
  schedule:
    # Nightly at 03:17 UTC (off-the-hour to dodge cron congestion).
    - cron: "17 3 * * *"
  workflow_dispatch:

# A running nightly should finish, not be cancelled by the next trigger.
concurrency:
  group: canary
  cancel-in-progress: false

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # canary runs test:slow, whose first step (test:integration) reaches
          # python-backed suites; hydrate the repo's only Git-LFS object.
          lfs: true
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @ag-bash/bash test:fuzz:long
      - run: pnpm --filter @ag-bash/bash fuzz:diff
      - name: Upload divergence report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-divergences
          path: packages/bash/fuzz-divergences.json
          if-no-files-found: ignore
          retention-days: 14

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # canary runs test:slow, whose first step (test:integration) reaches
          # python-backed suites; hydrate the repo's only Git-LFS object.
          lfs: true
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @ag-bash/bash test:slow

  audit-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # canary runs test:slow, whose first step (test:integration) reaches
          # python-backed suites; hydrate the repo's only Git-LFS object.
          lfs: true
      - uses: ./.github/actions/setup
      # Blocking: a nightly high/critical that reaches a PUBLISHED package is a
      # release-stopper even with zero code change, because the advisory database
      # moves on its own schedule. No continue-on-error — this must be able to fail.
      - run: node scripts/check-advisories.mjs
      # Non-blocking drift across the WHOLE workspace (root devDependencies +
      # examples/*). This is the pre-existing gate command kept verbatim, so
      # nightly visibility is unchanged in scope — only in consequence. Nightly is
      # the right home for it: detecting advisory-database drift is this job's
      # entire purpose, and it should surface drift without wedging the pipeline.
      - name: Whole-workspace advisory drift (report only)
        continue-on-error: true
        run: pnpm audit --audit-level=high
