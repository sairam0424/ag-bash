name: CodeQL
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly off-peak scan (Mondays 04:23 UTC) to catch advisories in code
    # that has not changed but is newly flagged by updated query packs.
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: jobs that need more must opt in explicitly.
permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Minimum scopes for CodeQL: upload SARIF + read repo/workflow metadata.
      # Do NOT broaden these — this repo holds an npm publish credential.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` statically flags workflow script-injection, missing
        # permissions, and unpinned actions — high value given the publish cred.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
