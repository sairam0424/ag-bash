name: Quality
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: jobs that need more must opt in explicitly.
permissions: {}

jobs:
  # Validate every workflow against GitHub's own Actions schema. `yaml.safe_load`
  # only checks YAML syntax — it accepts files GitHub then rejects at startup
  # (e.g. `with:` as a scalar, double-quoted strings inside ${{ }} expressions).
  # actionlint embeds that schema, so this catches "Invalid workflow file" before
  # a push instead of after. Pinned to a release tag + verified via checksum.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          # Installer pinned to the v1.7.7 commit SHA (not the moveable tag),
          # matching this repo's SHA-pin-everything supply-chain stance.
          ACTIONLINT_SHA: "03d0035246f3e81f36aed592ffb4bebf33a03106"
        run: |
          installer="$(mktemp)"
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash" -o "$installer"
          bash "$installer" "${ACTIONLINT_VERSION}"
          ./actionlint -color

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # check:pack-contents inspects the packed tarball, which must carry a
          # real vendor/cpython-emscripten/python.wasm rather than the 132-byte
          # Git-LFS pointer an lfs-less checkout leaves behind.
          lfs: true
      - uses: ./.github/actions/setup
      # Supply-chain gate (E3): MUST fail the build on any high/critical advisory
      # REACHABLE FROM A PUBLISHED PACKAGE. Do NOT add continue-on-error here —
      # that silently masks vulnerable shipped dependencies. Fix by pinning a
      # patched version via pnpm overrides, or record a reasoned, expiry-dated
      # auditConfig.ignoreCves entry in the root package.json.
      #
      # This replaced a bare `pnpm audit --audit-level=high`, which swept the
      # whole workspace and so blocked releases on advisories no consumer of
      # @ag-bash/bash can reach — and did so on the advisory database's schedule
      # rather than on any change of ours. Advisories in root devDependencies and
      # examples/* are now reported instead of blocking; the `advisories-report`
      # job below keeps that whole-workspace view visible, so the coverage
      # narrowed in consequence, not in scope. scripts/check-advisories.mjs
      # documents exactly which risk classes that trades away.
      - run: node scripts/check-advisories.mjs
      # Lint the publishable packages only (Biome + banned-pattern gate). The
      # examples/website app is a Next.js consumer with its own ESLint config and is
      # not part of the package quality gate; `pnpm -r lint` would sweep it in.
      - run: pnpm --filter './packages/*' lint
      - run: pnpm --filter @ag-bash/bash knip
      # bash-parity ratchet. This is the enforcement point for the Oils spec
      # corpus, which vitest.unit.config.ts deliberately excludes: as an
      # absolute-count gate it can never be green (43 known failures of 3826),
      # so it is gated here as a REGRESSION check instead. Fails on a new
      # failure AND on a stale baseline entry — the second direction matters,
      # because without it a fixed case leaves an entry that permanently
      # re-permits that exact failure.
      - run: pnpm --filter @ag-bash/bash check:spec-ratchet
      # Build BEFORE typecheck: @ag-bash/agent-bridge (and other consumers) import
      # @ag-bash/bash, whose types come from dist/index.d.ts — produced by the build.
      # Typechecking first yields TS2307 "Cannot find module '@ag-bash/bash'".
      - run: pnpm build
      # Typecheck the publishable packages only. The example consumers are owned by
      # the dedicated "Examples & Exports" workflow (examples.yml), which builds first
      # and is the canonical gate for them; sweeping them in here via `pnpm -r` is
      # redundant and surfaces example-specific CJS/ESM noise (e.g. cjs-consumer TS1479).
      - run: pnpm --filter './packages/*' typecheck
      - run: pnpm --filter @ag-bash/bash check:worker-sync
      # Packaging guards (release-integrity): versions stay synchronized and the
      # packed tarballs carry their load-bearing artifacts with no workspace:
      # leak. Cheap; catches the v6.0.0/v6.0.2 packaging-defect classes on PRs.
      - run: pnpm check:version-sync
      - run: pnpm check:pack-contents

  # Whole-workspace advisory visibility. This is the exact
  # `pnpm audit --audit-level=high` the `quality` job used to gate on, retained
  # verbatim and deliberately NON-blocking (continue-on-error is correct HERE and
  # only here — the gate itself must still be able to fail).
  #
  # It covers precisely what the reachability gate declines to fail on: root
  # devDependencies (vitest/vite/changesets) and examples/*. Keeping it means
  # nothing was deleted from CI coverage. A red mark here with a green `quality`
  # job is the designed signal: a real advisory exists that no consumer of the
  # published packages can reach. Triage it on its own schedule.
  advisories-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level=high
