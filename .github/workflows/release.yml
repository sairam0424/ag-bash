# Release — the single automated publish path (Changesets + npm Trusted Publishing).
#
# Flow: on push to main, changesets/action opens/updates a "Version Packages" PR
# that consumes the pending changesets, bumps the three packages to one
# synchronized version (fixed mode), and writes the changelog. Merging THAT PR
# re-runs this workflow, which runs `pnpm release` (build + `changeset publish`).
# `changeset publish` rewrites each `@ag-bash/bash: workspace:*` to the concrete
# version — the mechanical fix for the v6.0.0 uninstallable-package incident.
#
# Auth: npm Trusted Publishing (OIDC). The job mints a short-lived id-token; no
# long-lived NPM_TOKEN is required once a Trusted Publisher is configured per
# package on npmjs.com. Until that handshake is verified by a dry-run, an
# NPM_TOKEN secret (if present) is passed through as a fallback so releases never
# brick; delete the secret only after a green OIDC dry-run (see CONTRIBUTING.md).
#
# This supersedes publish.yml as the automated path; publish.yml is demoted to a
# manual workflow_dispatch-only emergency fallback to avoid double-publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + changeset publish --dry-run (proves OIDC mint; no upload)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write # changesets opens the Version Packages PR + pushes tags
      pull-requests: write # changesets manages the release PR
      id-token: write # OIDC: npm Trusted Publishing + provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NOTE: intentionally NOT using the composite setup action here — the
      # publish path needs registry-url wired and must NOT cache the pnpm store
      # on a credentialed job (cache-poisoning surface).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing requires npm >= 11.5.1; Node 22's bundled npm is older.
      # Upgrading in-place keeps us on the supported Node 22 LTS line (no forced
      # Node 24 migration).
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      # Guard: all three packages share one version (Changesets fixed mode).
      - run: pnpm check:version-sync
      # Build before the pack-contents check: it runs `pnpm pack` and asserts the
      # tarballs carry the load-bearing dist/ artifacts (bundles, WASM, workers,
      # .d.cts). Those only exist after a build — and the Changesets step's own build
      # runs later, so without this the check sees an empty dist/ and fails with
      # "MISSING required file in tarball".
      - run: pnpm build
      # Static packaging pre-filter before any publish.
      - run: pnpm check:pack-contents

      # On a normal push to main: open/update the Version Packages PR, and if a
      # version PR was just merged (no pending changesets), run `pnpm release`
      # to build + publish. On workflow_dispatch dry-run: prove the OIDC path.
      - name: Changesets release
        if: ${{ github.event_name == 'push' }}
        # BUMPED to v2.1.2 together with @changesets/cli v3 (root
        # package.json) IN THE SAME PR — this pairing is not optional.
        # changesets/action's own runtime error states it plainly:
        # "This version of the Changesets action is designed to work with
        # Changesets CLI v3. Changesets CLI v2 is not supported; use
        # Changesets action v1 instead." The two majors are coupled by the
        # action itself, so action-major and CLI-major must always move
        # together, never independently.
        #
        # History: #141 auto-merged changesets/action 1.8.0 -> 2.1.2 alone
        # (grouped with 12 unrelated, actually-safe bumps) while the CLI was
        # still pinned to v2, breaking every release attempt until #160
        # reverted the action back to v1.9.0 and added the dependabot ignore
        # rule (.github/dependabot.yml) to stop it recurring by accident.
        # This PR is the deliberate, paired bump that ignore rule was
        # guarding for: @changesets/cli -> ^3.0.3 lands in the same commit
        # as this action bump.
        #
        # v2.1.2's dereferenced commit SHA (via
        # `git ls-remote https://github.com/changesets/action refs/tags/v2.1.2^{}`)
        # is ae32849d5ba541f9ae29e40e22a623bc13562f51 — NOT
        # 66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4, which is the annotated
        # tag object's own SHA, not the commit it points to.
        #
        # v2's action.yml renamed every input from v1 (confirmed by reading
        # the real schema, not guessed): version -> version-script,
        # publish -> publish-script, commit -> commit-message,
        # title -> pr-title. It also replaced the GITHUB_TOKEN env var with a
        # github-token input (defaults to `${{ github.token }}` if omitted).
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # OIDC Trusted Publishing is now verified for all 7 packages (see
          # #167/#168 - a live dry-run against every package individually
          # reached only the expected "already published" version-conflict
          # rejection, never an auth error, with no NPM_TOKEN in this env at
          # all). The classic-token fallback (NODE_AUTH_TOKEN/NPM_TOKEN) that
          # lived here is removed; publish auth now comes exclusively from
          # OIDC via id-token: write. The NPM_TOKEN GitHub secret itself
          # should be deleted once this real (non-dry-run) push confirms the
          # publish path still works end-to-end without it.
          NPM_CONFIG_PROVENANCE: "true"

      # Dry-run path: prove OIDC Trusted Publishing actually authenticates,
      # WITHOUT uploading, before the maintainer deletes NPM_TOKEN.
      #
      # Uses npm's own --dry-run, not `changeset publish --dry-run`: this
      # repo's pinned Changesets CLI (^2.31.0) doesn't support that flag on
      # publish ("Unknown flag for publish: --dry-run" - the CLI's own error,
      # hit on a live run). That flag was added in a later CLI major, so the
      # previous version of this step was dead code that failed before ever
      # attempting auth.
      #
      # Loops all 7 packages individually (not just one) so each package's
      # own Trusted Publisher config on npmjs.com is verified directly,
      # rather than inferred from a single package. Every package here is
      # already published at its current version, so each dry-run is
      # EXPECTED to fail with a version-conflict error - the real signal is
      # whether it fails on AUTH (401/403/422, meaning OIDC exchange itself
      # is broken) vs fails LATER on the version check (meaning auth
      # succeeded and only the expected "already published" business rule
      # tripped). This step has no NPM_TOKEN/NODE_AUTH_TOKEN in its env, so
      # any auth success here can only come from OIDC.
      - name: OIDC publish dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          set +e
          auth_failed=0
          for pkg_dir in packages/agent-bridge packages/bash packages/browser packages/mcp-server examples/bash-agent examples/cjs-consumer examples/custom-command; do
            echo "::group::npm publish --dry-run ($pkg_dir)"
            output=$(cd "$pkg_dir" && npm publish --dry-run 2>&1)
            echo "$output"
            if echo "$output" | grep -qE "npm error code E4[0-9]{2}|Forbidden|Unauthorized|verifying sigstore"; then
              echo "::error::AUTH FAILURE in $pkg_dir - OIDC Trusted Publisher config likely missing or misconfigured"
              auth_failed=1
            else
              echo "OK: $pkg_dir got past auth (no OIDC error signature found)"
            fi
            echo "::endgroup::"
          done
          if [ "$auth_failed" -eq 1 ]; then
            echo "::error::One or more packages failed OIDC authentication - see groups above"
            exit 1
          fi
          echo "All 7 packages passed OIDC auth (dry-run rejections, where present, were version-conflict only - expected since all are already published)"

      # GitHub-native build provenance attestation over the packed tarballs,
      # layered on top of npm's own --provenance. Only on a real push release.
      - name: Attest build provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: "packages/*/*.tgz"
