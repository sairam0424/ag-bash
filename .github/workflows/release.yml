# Release — the single automated publish path (Changesets + npm Trusted Publishing).
#
# Flow: on push to main, changesets/action opens/updates a "Version Packages" PR
# that consumes the pending changesets, bumps the three packages to one
# synchronized version (fixed mode), and writes the changelog. Merging THAT PR
# re-runs this workflow, which runs `pnpm release` (build + `changeset publish`).
# `changeset publish` rewrites each `@ag-bash/bash: workspace:*` to the concrete
# version — the mechanical fix for the v6.0.0 uninstallable-package incident.
#
# Auth: npm Trusted Publishing (OIDC). The job mints a short-lived id-token; no
# long-lived NPM_TOKEN is required once a Trusted Publisher is configured per
# package on npmjs.com. Until that handshake is verified by a dry-run, an
# NPM_TOKEN secret (if present) is passed through as a fallback so releases never
# brick; delete the secret only after a green OIDC dry-run (see CONTRIBUTING.md).
#
# This supersedes publish.yml as the automated path; publish.yml is demoted to a
# manual workflow_dispatch-only emergency fallback to avoid double-publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + changeset publish --dry-run (proves OIDC mint; no upload)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write # changesets opens the Version Packages PR + pushes tags
      pull-requests: write # changesets manages the release PR
      id-token: write # OIDC: npm Trusted Publishing + provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NOTE: intentionally NOT using the composite setup action here — the
      # publish path needs registry-url wired and must NOT cache the pnpm store
      # on a credentialed job (cache-poisoning surface).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing requires npm >= 11.5.1; Node 22's bundled npm is older.
      # Upgrading in-place keeps us on the supported Node 22 LTS line (no forced
      # Node 24 migration).
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      # Guard: all three packages share one version (Changesets fixed mode).
      - run: pnpm check:version-sync
      # Build before the pack-contents check: it runs `pnpm pack` and asserts the
      # tarballs carry the load-bearing dist/ artifacts (bundles, WASM, workers,
      # .d.cts). Those only exist after a build — and the Changesets step's own build
      # runs later, so without this the check sees an empty dist/ and fails with
      # "MISSING required file in tarball".
      - run: pnpm build
      # Static packaging pre-filter before any publish.
      - run: pnpm check:pack-contents

      # On a normal push to main: open/update the Version Packages PR, and if a
      # version PR was just merged (no pending changesets), run `pnpm release`
      # to build + publish. On workflow_dispatch dry-run: prove the OIDC path.
      - name: Changesets release
        if: ${{ github.event_name == 'push' }}
        # PINNED to v1.x, deliberately NOT the v2.x dependabot bumped this to
        # in #141/#160: v2 hard-requires Changesets CLI v3 ("This version of
        # the Changesets action is designed to work with Changesets CLI v3.
        # Changesets CLI v2 is not supported; use Changesets action v1
        # instead" - the action's own error, hit on a live release attempt).
        # This repo pins @changesets/cli to ^2.31.0 (root package.json) -
        # upgrading that to v3 is a separate, bigger, riskier change than
        # fixing a stuck release, so stay on the CLI-v2-compatible action
        # major until that's done deliberately. v1.9.0 (latest v1.x, purely
        # additive over the v1.8.0 this repo ran before #141) is dereferenced
        # via `git ls-remote ...^{}`, not the annotated tag's own object SHA.
        # Add an ignore rule for this action in .github/dependabot.yml so the
        # next dependency-bump cycle doesn't reintroduce the same break.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback only — remove once OIDC Trusted Publishing is verified and
          # the NPM_TOKEN secret is deleted.
          #
          # BOTH names are required, not just one: NODE_AUTH_TOKEN is what
          # actions/setup-node's registry-url option wires into .npmrc for
          # classic token auth, but npm >=11.5.1's own publish command checks
          # a *literally-named* NPM_TOKEN env var first to decide auth
          # strategy — if that's absent, it unconditionally prefers OIDC
          # Trusted Publishing whenever id-token: write is granted (this repo
          # always grants it, for provenance), regardless of whether a valid
          # NODE_AUTH_TOKEN/.npmrc token also exists. Without NPM_TOKEN set
          # here too, every push-to-main release attempt silently skips the
          # token fallback and fails outright the moment OIDC hits a package
          # with no Trusted Publisher configured on npmjs.com yet (confirmed
          # via a live failed release: "No NPM_TOKEN found, but OIDC is
          # available - using npm trusted publishing", then a 404 on publish).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Dry-run path: prove OIDC Trusted Publishing actually authenticates,
      # WITHOUT uploading, before the maintainer deletes NPM_TOKEN.
      #
      # Uses npm's own --dry-run, not `changeset publish --dry-run`: this
      # repo's pinned Changesets CLI (^2.31.0) doesn't support that flag on
      # publish ("Unknown flag for publish: --dry-run" - the CLI's own error,
      # hit on a live run). That flag was added in a later CLI major, so the
      # previous version of this step was dead code that failed before ever
      # attempting auth. Runs against one representative package
      # (@ag-bash/bash) rather than all 7 - if OIDC exchange succeeds here,
      # the mechanism works; each package's own Trusted Publisher config on
      # npmjs.com is what determines whether the eventual real publish
      # succeeds for that specific package.
      #
      # This step deliberately has no NPM_TOKEN/NODE_AUTH_TOKEN in its env
      # (unlike the "Changesets release" step above), so success here can
      # only come from the OIDC path.
      - name: OIDC publish dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        working-directory: packages/bash
        run: npm publish --dry-run

      # GitHub-native build provenance attestation over the packed tarballs,
      # layered on top of npm's own --provenance. Only on a real push release.
      - name: Attest build provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: "packages/*/*.tgz"
