# Trivy (Container Image & Config) — the Docker MCP Catalog gate.
#
# The Dockerfile (node:22-bookworm-slim + compiled native addons, built
# specifically for the pending Docker MCP Catalog submission) previously had
# no CI-side vulnerability or misconfiguration scan: a vulnerable base image
# or an unpatched apt package could have shipped straight into a public
# catalog listing with zero automated check. This workflow closes that gap
# with two scans — a cheap Dockerfile misconfiguration check, and a real
# vulnerability scan of the image actually built from it — and only runs when
# the Dockerfile changes.
#
# Both scans are non-blocking (`exit-code: 0`) for now: findings surface via
# SARIF upload to the repo's Security tab (Code Scanning) rather than failing
# the build, matching this repo's existing pattern of separating a blocking
# gate from a non-blocking report (see quality.yml's advisories-report job).
# Flip `exit-code` to `1` once a maintainer has triaged the current baseline.
name: Trivy (Container Image & Config)

on:
  push:
    branches: [main, develop]
    paths: ['Dockerfile']
  pull_request:
    branches: [main, develop]
    paths: ['Dockerfile']
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: jobs that need more must opt in explicitly.
permissions: {}

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # SARIF upload to the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dockerfile misconfiguration scan (e.g. missing USER, missing
      # HEALTHCHECK) — no image build required.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the image with the Dockerfile's own default AG_BASH_VERSION
      # build-arg, so the vuln scan below reflects what would actually ship.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ag-bash-mcp:ci

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ag-bash-mcp:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: .
